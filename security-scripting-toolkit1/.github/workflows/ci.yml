name: ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tests (PowerShell 7)
        shell: pwsh
        run: |
          Get-ChildItem scripts -Recurse -Filter 'Test-*.ps1' | ForEach-Object {
            Write-Host "== $($_.FullName)"
            & pwsh -NoProfile -File $_.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem scripts -Recurse -Filter 'Test-*.ps1' | ForEach-Object {
            Write-Host "== $($_.FullName)"
            & powershell.exe -NoProfile -File $_.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $r | Format-Table RuleName, Severity, ScriptName, Line -AutoSize | Out-String -Width 200 | Write-Host
          if ($r | Where-Object Severity -eq 'Error') { exit 1 }
